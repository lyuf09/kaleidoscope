<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Evidence plate comparing image and access times</title>
  <desc id="desc">A restrained archival contact sheet showing camera, server, and badge timestamps as separate records.</desc>
  <defs>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1H8M0 5H8" stroke="#747c70" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "DM Mono", "SFMono-Regular", Consolas, monospace; fill: #242722; }
      .micro { font-size: 18px; letter-spacing: 2.6px; }
      .small { font-size: 24px; letter-spacing: 1.2px; }
      .data { font-size: 34px; letter-spacing: .8px; }
      .rule { stroke: #242722; stroke-width: 2; fill: none; }
      .faint { stroke: #747c70; stroke-opacity: .45; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f1eee5"/>
  <rect x="60" y="58" width="1480" height="884" class="rule"/>
  <path d="M60 150H1540M548 150V942M1040 150V942" class="rule faint"/>

  <text x="92" y="113" class="mono micro">PROJECT SURVEY ARCHIVE / EVIDENCE PLATE 03</text>
  <text x="1414" y="113" class="mono micro">17 AUG</text>

  <text x="92" y="201" class="mono micro">SOURCE</text>
  <text x="590" y="201" class="mono micro">FRAME / EVENT</text>
  <text x="1082" y="201" class="mono micro">TIME</text>

  <rect x="92" y="246" width="404" height="214" fill="#d8d4c8"/>
  <rect x="112" y="266" width="364" height="174" fill="url(#scan)"/>
  <path d="M138 404L216 328L278 366L342 294L448 404" class="rule faint"/>
  <text x="92" y="506" class="mono small">CAMERA RAW</text>
  <text x="590" y="306" class="mono data">017</text>
  <text x="1082" y="306" class="mono data">16:52:08</text>
  <text x="590" y="368" class="mono small">IMAGE / 03</text>
  <rect x="590" y="392" width="236" height="30" fill="#242722"/>

  <rect x="92" y="568" width="404" height="118" fill="#e4e0d6"/>
  <path d="M116 604H468M116 626H416M116 648H452" class="rule faint"/>
  <text x="92" y="734" class="mono small">SERVER INGEST</text>
  <text x="590" y="628" class="mono data">018</text>
  <text x="1082" y="628" class="mono data">16:55:14</text>

  <rect x="92" y="794" width="404" height="90" fill="#d8d4c8"/>
  <path d="M116 824H382M116 850H454" class="rule faint"/>
  <text x="590" y="844" class="mono small">ACCESS / GRANTED</text>
  <text x="1082" y="844" class="mono data">17:46:00</text>

  <path d="M1012 306H954V844H1012" class="rule"/>
  <path d="M978 330V820" stroke="#242722" stroke-width="2" stroke-dasharray="10 13"/>
  <text x="1160" y="914" class="mono micro">CLOCKS HELD SEPARATELY</text>
</svg>
